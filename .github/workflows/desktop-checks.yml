name: Desktop checks
on:
  pull_request:
  push:
    branches: [feature/bootstrap-desktop-architecture]
jobs:
  check:
    runs-on: windows-latest
    strategy:
      matrix:
        edition: [central, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - shell: pwsh
        run: |
          if (-not (Test-Path package-lock.json)) { throw "package-lock.json must be committed" }
          if (-not (Test-Path src-tauri/Cargo.lock)) { throw "src-tauri/Cargo.lock must be committed" }
          if (git status --porcelain -- package-lock.json src-tauri/Cargo.lock) { throw "Lockfiles changed during CI; regenerate and commit them" }
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml --no-default-features --features ${{ matrix.edition }}
