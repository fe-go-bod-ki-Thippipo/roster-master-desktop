name: Desktop checks
on:
  pull_request:
  push:
    branches: [feature/bootstrap-desktop-architecture]
jobs:
  check:
    runs-on: windows-latest
    strategy:
      matrix:
        edition: [central, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run build
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/icons | Out-Null
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 32,32
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(35,78,112))
          $ico = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $fs = [System.IO.File]::Create("src-tauri/icons/icon.ico")
          $ico.Save($fs); $fs.Close(); $g.Dispose(); $bmp.Dispose()
      - run: cargo check --manifest-path src-tauri/Cargo.toml --no-default-features --features ${{ matrix.edition }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-lockfiles-${{ matrix.edition }}
          path: |
            package-lock.json
            src-tauri/Cargo.lock
          if-no-files-found: warn
      - shell: pwsh
        if: matrix.edition == 'central'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "chore(DEP-01): commit generated dependency lockfiles"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
