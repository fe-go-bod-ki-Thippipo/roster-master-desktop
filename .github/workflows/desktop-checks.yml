name: Desktop checks
on:
  pull_request:
  push:
    branches: [feature/bootstrap-desktop-architecture]
jobs:
  check:
    runs-on: windows-latest
    strategy:
      matrix:
        edition: [central, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: git diff --exit-code -- package-lock.json
      - run: git diff --exit-code -- src-tauri/Cargo.lock
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml --no-default-features --features ${{ matrix.edition }}
